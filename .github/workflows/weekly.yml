name: Weekly flight check

on:
  schedule:
    # Mondays at 11:00 UTC = 7:00am Puerto Rico (UTC-4 all year).
    # GitHub sometimes starts scheduled runs a few minutes late.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email"
        type: boolean
        default: true
      email_only:
        description: "Only re-send the latest results by email (no searches)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Search flights and update data
        if: ${{ !inputs.email_only }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tracker/tracker.py --no-email

      - name: Save price history
        if: ${{ !inputs.email_only }}
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Flight prices for $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v6
        if: ${{ !inputs.email_only }}

      - uses: actions/upload-pages-artifact@v5
        if: ${{ !inputs.email_only }}
        with:
          path: site

      - name: Publish page
        if: ${{ !inputs.email_only }}
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Send email
        if: github.event_name == 'schedule' || inputs.send_email || inputs.email_only
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}  # only to check searches left; doesn't use one
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python tracker/tracker.py --email-only
